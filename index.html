<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Taltex Meathub | Fresh & Healthy Rabbit Meat in Uganda</title>

    <meta
      name="description"
      content="Buy fresh, hygienically processed rabbit meat in Uganda. Taltex Meathub supplies whole rabbits, cuts, fried portions, and family packs with same-day delivery."
    />

    <meta
      name="keywords"
      content="rabbit meat Uganda, fresh rabbit meat, healthy protein Uganda, rabbit meat delivery, Taltex Meathub, fresh meat supplier Uganda, low fat meat Uganda"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FoodEstablishment",
        "name": "Taltex Meathub",
        "url": "https://www.taltexmeathub.com",
        "logo": "https://www.taltexmeathub.com/logo.png",
        "description": "Taltex Meathub is a trusted supplier of fresh, healthy rabbit meat in Uganda. We offer whole rabbits, fresh cuts, fried portions, and family packs, hygienically processed and delivered promptly.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Basoga",
          "addressLocality": "Uganda",
          "addressRegion": "Basoga,
          "addressCountry": "UG"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+256-769-623-715 ",
          "contactType": "Customer Service",
          "email": "support@taltexmeathub.com"
        },
        "servesCuisine": "Meat & Protein",
        "priceRange": "₦₦₦",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.taltexmeathub.com/products?query={search_term_string}",
          "query-input": "required name=search_term_string"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Rabbit Meat Products",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Product",
                "name": "Fresh Whole Rabbit",
                "url": "https://www.taltexmeathub.com/products/fresh-whole-rabbit",
                "description": "Freshly processed whole rabbit meat, hygienically handled and ready for cooking."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Product",
                "name": "Fresh Rabbit Cuts Pack",
                "url": "https://www.taltexmeathub.com/products/rabbit-cuts-pack",
                "description": "Pre-cut fresh rabbit portions, cleaned and ready to cook."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Product",
                "name": "Fried Rabbit Portion",
                "url": "https://www.taltexmeathub.com/products/fried-rabbit-portion",
                "description": "Crispy, well-seasoned fried rabbit prepared fresh on order."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Product",
                "name": "Family Rabbit Pack",
                "url": "https://www.taltexmeathub.com/products/family-rabbit-pack",
                "description": "Value family pack containing multiple fresh rabbit portions."
              }
            }
          ]
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
